    <text x="53" y="286" fill="#a9e6c4" font-size="55" font-weight="700" letter-spacing="-1.8">Everything in order.</text>
    <text x="56" y="330" fill="#b6c7be" font-size="17">Sales, stock, customer credit and private shops.</text>
