      <path d="M68 71h28l-4-9H72zM70 78v13h24V78M78 91V81h8v10M68 71v3a4 4 0 0 0 7 2 4 4 0 0 0 7 0 4 4 0 0 0 7 0 4 4 0 0 0 7-2v-3"/>
