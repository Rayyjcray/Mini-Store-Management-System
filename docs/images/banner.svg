<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">DormStore Management System</title>
  <desc id="description">An offline Windows point of sale application with private shops, local records, and sales and inventory management.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102e27"/>
      <stop offset="1" stop-color="#0b1916"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17684e"/>
      <stop offset="1" stop-color="#268568"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#background)"/>
  <circle cx="1190" cy="30" r="260" fill="#163e31" opacity=".32"/>
  <circle cx="1000" cy="440" r="230" fill="#1e5942" opacity=".16"/>
