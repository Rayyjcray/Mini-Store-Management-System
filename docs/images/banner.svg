    <circle cx="363" cy="373" r="2" fill="#739386"/>
    <text x="379" y="378" fill="#d5e4dc" font-size="14">Local SQLite storage</text>
    <rect x="744" y="72" width="470" height="280" rx="17" fill="#0a1813" opacity=".5"/>
    <rect x="734" y="62" width="470" height="280" rx="17" fill="#f6faf7"/>
    <path d="M751 62h436a17 17 0 0 1 17 17v26H734V79a17 17 0 0 1 17-17" fill="#e5eee8"/>
    <circle cx="757" cy="84" r="4" fill="#9cb2a4"/>
